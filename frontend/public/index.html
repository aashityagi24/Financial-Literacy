        <meta charset="utf-8" />

        <meta name="theme-color" content="#1D3557" />

        <!-- ═══ CRITICAL RESOURCE HINTS (must be first) ═══════════════════ -->
        <!-- Self-hosted fonts — preload the 2 WOFF2 files so they start downloading
             before the CSS is parsed. No external round-trip to Google Fonts. -->
        <link rel="preload" as="font" type="font/woff2"
              href="/fonts/fredoka-latin.woff2" crossorigin />
        <link rel="preload" as="font" type="font/woff2"
              href="/fonts/outfit-latin.woff2" crossorigin />

        <!-- Inline @font-face — zero extra network request; references /fonts/ which
             is served straight from /public/fonts/, bypassing webpack. -->
        <style>
          @font-face {
            font-family: 'Fredoka';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/fredoka-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,
              U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,
              U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
          }
          @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/outfit-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,
              U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,
              U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
          }
        </style>

        <!-- Preload hero image in AVIF (22 KB smaller than WebP at 800w).
             Browser picks the best format from the srcset. -->
        <link rel="preload" as="image" href="/hero-child-800.avif"
              imagesrcset="/hero-child-400.avif 390w, /hero-child-800.avif 800w"
              imagesizes="(max-width: 1023px) calc(100vw - 96px), 640px"
              fetchpriority="high" type="image/avif" />

        <!-- Backend API + payment preconnect -->
        <link rel="preconnect" href="https://smart-money-learn-5.preview.emergentagent.com" />
        <link rel="preconnect" href="https://coinquest.co.in" />
        <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
        <link rel="dns-prefetch" href="https://api.razorpay.com" />

             load the actual scripts after the page has rendered. This removes
             ~200-300ms from TBT without losing any events. -->

          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-4XWZZ3ET5R');

            ga.async = true;
            ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-4XWZZ3ET5R';
            document.head.appendChild(ga);

            })(window,document,'script','dataLayer','GTM-M38LDVBT');
          }
          if (document.readyState === 'complete') { _loadAnalytics(); }
          else { window.addEventListener('load', _loadAnalytics); }

        <meta name="description" content="Money lessons for children aged 5–10 (KG to Class 5): stories, games and real jobs at home, 10 minutes a day. Made in India. Try a day for ₹29." />

        <!-- FAQ Structured Data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {"@type": "Question", "name": "What does my child get with the one-day plan?", "acceptedAnswer": {"@type": "Answer", "text": "Full access to every story, video, game and quiz for 24 hours, plus the parent dashboard. It's the easiest way to see whether your child enjoys CoinQuest before you choose a longer plan."}},
            {"@type": "Question", "name": "What happens when the day ends? Will I be charged again?", "acceptedAnswer": {"@type": "Answer", "text": "No. Every plan is a one-time payment and nothing renews automatically, so you'll never be charged unless you choose a plan. If your child wants to keep going, pick a 1-, 6- or 12-month plan."}},
            {"@type": "Question", "name": "What age is CoinQuest for?", "acceptedAnswer": {"@type": "Answer", "text": "Children aged 5 to 10, from KG to Class 5. Lessons are grouped by age, so your child learns what suits their stage, from what money is and where it comes from to saving, spending wisely and running a small market stall."}},
            {"@type": "Question", "name": "How much is there for my child to do?", "acceptedAnswer": {"@type": "Answer", "text": "More than 200 stories, videos, games and quizzes at every level, with new ones added every week. Your child learns through the stories and videos, then practises with the games and quizzes."}},
            {"@type": "Question", "name": "Can my child use CoinQuest on their own?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. It's designed so that children as young as 5 can find their way around by themselves. For the first session, we suggest sitting with your child so you can explore it together and see what they'll be learning."}},
            {"@type": "Question", "name": "Isn't this just more screen time?", "acceptedAnswer": {"@type": "Answer", "text": "CoinQuest needs just 10 to 15 minutes a day. After that, the learning carries on away from the screen through the habits it builds, like chores and small jobs at home."}},
            {"@type": "Question", "name": "Are there any ads?", "acceptedAnswer": {"@type": "Answer", "text": "No, never. There are no ads or tracking tools anywhere in the CoinQuest app, so nothing interrupts your child's learning or tries to sell them anything."}},
            {"@type": "Question", "name": "What information do you collect about my child?", "acceptedAnswer": {"@type": "Answer", "text": "Very little. We ask only for your child's name, plus an email address and profile photo if you choose to add them. We use this, along with their progress, only to run their account and show you how they're doing. We never sell your child's information or use it for advertising, and you can ask us to delete it at any time by emailing hello@coinquest.co.in."}},
            {"@type": "Question", "name": "Can both parents, or more than one child, use one plan?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. When you choose a plan, select 1 or 2 parent accounts and up to 5 children, and the price updates to match. With 2 parent accounts, both parents can log in and follow progress."}},
            {"@type": "Question", "name": "Can I get a refund?", "acceptedAnswer": {"@type": "Answer", "text": "We don't offer refunds, which is why you can try CoinQuest for a day first. If a technical problem stops your child from using CoinQuest, email hello@coinquest.co.in and we'll extend your plan by the number of days affected."}}
          ]
        }
        </script>
